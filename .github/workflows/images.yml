name: Fetch painting images

on:
  push:
    branches: [claude/project-thread-vbuwjl, main]
    paths: [content/paintings.json, tools/fetch_images.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch missing painting images
        run: python3 tools/fetch_images.py
      - name: Save new images to the repo
        run: |
          git config user.name "artolingo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "Add painting images" && git push)
